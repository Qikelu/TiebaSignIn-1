name: Auto Keepalive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive Action
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          days_before: 45
          commit_message: "chore: auto keepalive"
          use_api: false
          target_branch: master  # ✅ 重点！指定你的分支 master
name: Auto Keepalive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Check last commit days
        id: check_time
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DIFF=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "days=$DIFF" >> $GITHUB_OUTPUT
          echo "Last commit: $DIFF days ago"

      - name: Refresh commit (≥45天执行)
        if: ${{ steps.check_time.outputs.days >= 45 }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 在README末尾追加一个空格+换行
          echo " " >> README.md
          git add README.md
          git commit -m "chore: auto keepalive refresh"
          git push origin master
name: Auto Keepalive
on:
  schedule:
    - cron: '0 0 * * *' # UTC每天0点检查
  workflow_dispatch: # 支持手动触发

# 重点：在这里直接给token写权限，解决无法提交commit的问题
permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Keepalive Action
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          days_before: 45
          commit_message: "chore: auto keepalive"
          use_api: false
